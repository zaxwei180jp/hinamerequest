<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>需求單</title>
    <style>
        :root {
            --primary: #D4A5A5;
            --secondary: #E0B5B5;
            --accent: #E8C5C5;
            --bg: #FFFFFF;
            --surface: #FFFFFF;
            --border: #F0E0E0;
            --text: #2C2C2C;
            --text-light: #888888;
            --danger: #D4A5A5;
            --success: #B5D0C6;
            --warning: #C5D4E8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box !important;
            max-width: 100% !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.5;
            width: 100% !important;
            max-width: 100% !important;
            overflow-x: hidden !important;
        }

        /* Header */
        header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100% !important;
            max-width: 100% !important;
            overflow-x: hidden !important;
        }

        .header-content {
            max-width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            flex: 1;
        }

        .btn {
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--surface);
        }

        .btn-primary:active {
            background-color: var(--secondary);
        }

        .btn-secondary {
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:active {
            background-color: var(--border);
        }

        .btn-danger {
            background-color: var(--danger);
            color: var(--surface);
        }

        .btn-danger:active {
            opacity: 0.8;
        }

        .btn-small {
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            min-height: 40px;
        }

        /* Container */
        .container {
            width: 100% !important;
            max-width: 100% !important;
            padding: 1rem;
            margin: 0 auto;
            overflow-x: hidden !important;
        }

        /* List */
        .list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            gap: 1rem;
        }

        .card:active {
            background-color: var(--border);
            transform: scale(0.98);
        }

        .card-content {
            flex: 1;
        }

        .card-image {
            width: 120px;
            height: 120px;
            border-radius: 0.5rem;
            object-fit: cover;
            background-color: var(--border);
            flex-shrink: 0;
        }

        .card-image-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 0.5rem;
            background-color: var(--border);
            flex-shrink: 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .card-subtitle-row {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 0.25rem;
        }

        .card-subtitle {
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 500;
        }

        .card-category {
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .card-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            font-size: 0.875rem;
            margin-bottom: 0.75rem;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .info-label {
            color: var(--text-light);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-value {
            font-weight: 500;
        }

        /* Input with clear button */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-wrapper input {
            padding-right: 2.5rem;
            width: 100%;
            flex: 1;
        }

        .clear-btn {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.5rem;
            line-height: 1;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: auto;
            min-height: auto;
        }

        .input-wrapper input:not(:placeholder-shown) ~ .clear-btn {
            opacity: 1;
        }

        .clear-btn:active {
            color: var(--text);
        }

        .badges {
            display: flex;
            flex-wrap: nowrap;
            gap: 0.5rem;
            overflow-x: auto;
        }

        /* Filter Section */
        .collapsible-section {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .collapsible-header {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .collapsible-header:active {
            background-color: var(--border);
        }

        .collapsible-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .collapsible-icon {
            transition: transform 0.2s;
            font-size: 1.2rem;
        }

        .collapsible-icon.collapsed {
            transform: rotate(-90deg);
        }

        .collapsible-content {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
            padding: 0 1rem 1rem 1rem;
        }

        .collapsible-content.collapsed {
            max-height: 0;
            padding: 0 1rem 0 1rem;
        }

        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-light);
        }

        /* Stats section */
        .stats-section {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            padding: 0;
        }

        .stat-card {
            background-color: var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
        }

        .filter-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text);
            background-color: var(--surface);
            min-height: 44px;
        }

        .filter-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(212, 165, 165, 0.1);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            background-color: var(--surface);
            color: var(--text);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 36px;
            white-space: nowrap;
        }

        .filter-btn:active {
            background-color: var(--border);
        }

        .filter-btn.active {
            background-color: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
        }

        .badge {
            display: inline-block;
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-status {
            background-color: var(--border);
            color: var(--text);
        }

        /* Status colors for list */
        .badge-status-未採買未付款未開始 {
            background-color: #D4BEA6 !important;
            color: #000000 !important;
        }

        .badge-status-已下訂 {
            background-color: #E8C9B5 !important;
            color: #000000 !important;
        }

        .badge-status-在日集貨 {
            background-color: #B5D0C6 !important;
            color: #000000 !important;
        }

        .badge-status-在台集貨 {
            background-color: #C5D4E8 !important;
            color: #000000 !important;
        }

        .badge-status-完成 {
            background-color: #D0C9D4 !important;
            color: #000000 !important;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: flex-end;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--surface);
            width: 100% !important;
            max-width: 100% !important;
            max-height: 90vh;
            border-radius: 1rem 1rem 0 0;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            padding: 90px 1rem 2rem 1rem !important;
            margin-top: 0 !important;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            background-color: var(--surface);
            position: fixed !important;
            bottom: auto !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            z-index: 1001 !important;
            width: 100% !important;
            max-width: 100% !important;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            flex: 1;
        }

        .modal-header-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            padding: 0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text);
            background-color: var(--surface);
            min-height: 44px;
        }

        .input-wrapper input {
            min-height: 44px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(155, 140, 126, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        /* Status Button Group */
        .status-button-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .status-btn {
            padding: 0.75rem 1rem;
            border: 2px solid #E8D0D0;
            border-radius: 0.5rem;
            background-color: #FAFAFA;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 44px;
            text-align: left;
        }

        .status-btn:active {
            background-color: #F0E0E0;
        }

        .status-btn.active {
            background-color: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
        }

        /* Section */
        .form-section {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .form-section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-light);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        /* Image upload */
        .image-upload-section {
            border: 1px dashed var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .image-preview {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .image-item {
            position: relative;
            border-radius: 0.5rem;
            overflow: hidden;
            background-color: var(--border);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-remove {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.25rem;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .image-placeholder {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .upload-input {
            display: none;
        }

        /* Buttons */
        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .modal-actions .btn {
            flex: 1;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status Badge Colors */
        .status-pending {
            background-color: #E8D4C8;
            color: #6B4423;
        }

        .status-in-progress {
            background-color: #D4DDE8;
            color: #234B6B;
        }

        .status-done {
            background-color: #C8E8D4;
            color: #236B42;
        }

        @media (prefers-color-scheme: dark) {
            .status-pending {
                background-color: #5C3E2F;
                color: #E8D4C8;
            }

            .status-in-progress {
                background-color: #2F475C;
                color: #D4DDE8;
            }

            .status-done {
                background-color: #2F5C42;
                color: #C8E8D4;
            }
        }

        /* Responsive */
        @media (min-width: 768px) {
            .modal-content {
                max-width: 500px;
                max-height: none;
                margin: auto;
                border-radius: 1rem;
            }

            .modal {
                align-items: center;
                justify-content: center;
                background-color: rgba(0, 0, 0, 0.3);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <h1>需求單</h1>
            <button class="btn btn-secondary" id="refreshBtn" title="重新整理">🔄</button>
            <button class="btn btn-primary" id="newBtn">新增</button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Stats Section -->
        <div class="collapsible-section">
            <div class="collapsible-header" onclick="toggleSection('stats')">
                <span class="collapsible-title">📊 統計數據</span>
                <span class="collapsible-icon" id="statsIcon">▼</span>
            </div>
            <div class="collapsible-content" id="statsContent">
                <div class="stats-section" id="statsContainer"></div>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="collapsible-section">
            <div class="collapsible-header" onclick="toggleSection('filter')">
                <span class="collapsible-title">🔍 篩選</span>
                <span class="collapsible-icon" id="filterIcon">▼</span>
            </div>
            <div class="collapsible-content" id="filterContent">
                <div class="filter-section">
                    <div class="filter-group">
                        <div class="input-wrapper">
                            <input type="text" id="filterCustomer" placeholder="篩選客戶名稱" class="filter-input">
                            <button type="button" class="clear-btn" onclick="clearFilterCustomer()">✕</button>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label>購買狀態</label>
                        <div id="filterBuyStatus" class="filter-buttons"></div>
                    </div>
                    <div class="filter-group">
                        <label>付款狀態</label>
                        <div id="filterPayStatus" class="filter-buttons"></div>
                    </div>
                    <div class="filter-group">
                        <label>發貨狀態</label>
                        <div id="filterShipStatus" class="filter-buttons"></div>
                    </div>
                    <button id="clearFilters" class="btn btn-secondary btn-small">清除篩選</button>
                </div>
            </div>
        </div>

        <div id="listView">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 1rem;">載入中…</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="formModal">
        <div class="modal-header">
            <h2 class="modal-title" id="formTitle">新增需求單</h2>
            <div class="modal-header-actions">
                <button type="button" class="btn btn-secondary btn-small" id="cancelBtn" style="display:none;">取消</button>
                <button type="button" class="btn btn-danger btn-small" id="deleteBtn" style="display:none;">刪除</button>
                <button type="submit" class="btn btn-primary btn-small" id="submitBtn">保存</button>
                <button class="modal-close" id="closeBtn">✕</button>
            </div>
        </div>

        <div class="modal-content">
            <form id="itemForm">
                <!-- 基本資訊 -->
                <div class="form-section">
                    <div class="section-title">基本資訊</div>

                    <div class="form-group">
                        <label>需求單編號</label>
                        <input type="text" id="title" placeholder="例：REQ-001" required>
                    </div>

                    <div class="form-group">
                        <label>客戶</label>
                        <div class="input-wrapper">
                            <input type="text" id="customer" placeholder="客戶名稱" required>
                            <button type="button" class="clear-btn" onclick="clearCustomer()">✕</button>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>類別</label>
                            <select id="category" required>
                                <option value="">— 選擇 —</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>商品名稱</label>
                            <div class="input-wrapper">
                                <input type="text" id="productName" placeholder="商品名稱" required>
                                <button type="button" class="clear-btn" onclick="clearProductName()">✕</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 圖片上傳 -->
                <div class="form-section">
                    <div class="section-title">商品圖片</div>
                    <div class="image-upload-section">
                        <button type="button" class="btn btn-secondary btn-small" id="uploadBtn">上傳圖片</button>
                        <input type="file" class="upload-input" id="fileInput" accept="image/*" multiple>
                        <div class="image-preview" id="imagePreview"></div>
                    </div>
                    <input type="hidden" id="productImages">
                </div>

                <!-- 數量與價格 -->
                <div class="form-section">
                    <div class="section-title">數量與價格</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>數量</label>
                            <input type="number" id="quantity" placeholder="0" min="0" step="1" inputmode="decimal" required>
                        </div>

                        <div class="form-group">
                            <label>日幣成本單價</label>
                            <input type="number" id="jpyCost" placeholder="¥ 0" min="0" step="0.01" inputmode="decimal">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>日幣報價單價</label>
                            <input type="number" id="jpyPrice" placeholder="¥ 0" min="0" step="0.01" inputmode="decimal">
                        </div>

                        <div class="form-group">
                            <label>台幣報價單價</label>
                            <input type="number" id="twdPrice" placeholder="$ 0" min="0" step="0.01" inputmode="decimal">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>重量 (KG)</label>
                        <input type="number" id="weight" placeholder="0" min="0" step="0.01" inputmode="decimal">
                    </div>
                </div>

                <!-- 狀態 -->
                <div class="form-section">
                    <div class="section-title">狀態</div>

                    <div class="form-group">
                        <label>購買狀態</label>
                        <div id="buyStatusGroup" class="status-button-group"></div>
                    </div>

                    <div class="form-group">
                        <label>付款狀態</label>
                        <div id="payStatusGroup" class="status-button-group"></div>
                    </div>

                    <div class="form-group">
                        <label>發貨狀態</label>
                        <div id="shipStatusGroup" class="status-button-group"></div>
                    </div>
                </div>

                <!-- 日期 -->
                <div class="form-section">
                    <div class="section-title">日期</div>

                    <div class="form-group">
                        <label>採買日期</label>
                        <input type="date" id="purchaseDate" required>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Configuration
        const NOTION_DB_ID = '3e1c662d5fc480f680b0ef4c0b936e25';
        const API_BASE = '/api/notion';
        const CLOUDINARY_CLOUD_NAME = 'doue38blc';
        const CLOUDINARY_API_KEY = '487785152371311';

        // Field mapping - 繁體中文欄位名稱
        const FIELDS = {
            title: '需求單號',
            customer: '客戶',
            category: '類別',
            productName: '商品名稱',
            productImages: '商品圖片',
            quantity: '數量',
            jpyCost: '日幣成本單價',
            jpyPrice: '日幣報價單價',
            twdPrice: '台幣報價單價',
            jpyTotal: '日幣報價總價',
            twdTotal: '台幣總價',
            twdProfit: '台幣利潤',
            weight: '重量',
            buyStatus: '購買狀態',
            payStatus: '付款狀態',
            shipStatus: '發貨狀態',
            purchaseDate: '採買日期'
        };

        // State
        let items = [];
        let currentItem = null;
        let fieldOptions = {
            categories: [],
            buyStatuses: [],
            payStatuses: [],
            shipStatuses: []
        };
        let uploadedImages = [];

        // Filter State
        let filters = {
            customer: '',
            buyStatus: [],
            payStatus: [],
            shipStatus: []
        };

        // DOM Elements
        const listView = document.getElementById('listView');
        const formModal = document.getElementById('formModal');
        const itemForm = document.getElementById('itemForm');
        const newBtn = document.getElementById('newBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const closeBtn = document.getElementById('closeBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        const submitBtn = document.getElementById('submitBtn');
        const formTitle = document.getElementById('formTitle');
        const filterCustomerInput = document.getElementById('filterCustomer');
        const filterBuyStatusGroup = document.getElementById('filterBuyStatus');
        const filterPayStatusGroup = document.getElementById('filterPayStatus');
        const filterShipStatusGroup = document.getElementById('filterShipStatus');
        const clearFiltersBtn = document.getElementById('clearFilters');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');

        // Helper: Get value from Notion property
        function getPropertyValue(prop) {
            if (!prop) return '';
            if (prop.title) return prop.title.map(t => t.plain_text).join('');
            if (prop.rich_text) return prop.rich_text.map(t => t.plain_text).join('');
            if (prop.number !== undefined) return prop.number || '';
            if (prop.select) return prop.select.name || '';
            if (prop.status) return prop.status.name || '';
            if (prop.date) return prop.date.start || '';
            if (prop.formula && prop.formula.number !== undefined) return prop.formula.number || '';
            return '';
        }

        // Helper: Format number as rounded integer with locale string
        function formatNumber(value) {
            if (!value) return '0';
            return Math.round(parseFloat(value)).toLocaleString();
        }

        // Initialize
        async function init() {
            await fetchFieldOptions();
            await fetchItems();
        }

        // Fetch field options from Notion
        async function fetchFieldOptions() {
            try {
                const response = await fetch(`${API_BASE}?action=getDatabase&databaseId=${NOTION_DB_ID}`);
                const data = await response.json();

                if (data.properties) {
                    const props = data.properties;

                    // Extract select/status options
                    if (props[FIELDS.category]?.select?.options) {
                        fieldOptions.categories = props[FIELDS.category].select.options.map(o => o.name);
                    }
                    if (props[FIELDS.buyStatus]?.status?.options) {
                        fieldOptions.buyStatuses = props[FIELDS.buyStatus].status.options.map(o => o.name);
                    }
                    if (props[FIELDS.payStatus]?.status?.options) {
                        fieldOptions.payStatuses = props[FIELDS.payStatus].status.options.map(o => o.name);
                    }
                    if (props[FIELDS.shipStatus]?.status?.options) {
                        fieldOptions.shipStatuses = props[FIELDS.shipStatus].status.options.map(o => o.name);
                    }

                    populateSelects();
                    populateStatusButtons();
                    populateFilterButtons();
                }
            } catch (error) {
                console.error('Failed to fetch field options:', error);
            }
        }

        // Populate select elements
        function populateSelects() {
            const categorySelect = document.getElementById('category');

            fieldOptions.categories.forEach(opt => {
                categorySelect.appendChild(new Option(opt, opt));
            });
        }

        // Populate status buttons
        function populateStatusButtons() {
            const buyStatusGroup = document.getElementById('buyStatusGroup');
            const payStatusGroup = document.getElementById('payStatusGroup');
            const shipStatusGroup = document.getElementById('shipStatusGroup');

            // Clear existing buttons
            buyStatusGroup.innerHTML = '';
            payStatusGroup.innerHTML = '';
            shipStatusGroup.innerHTML = '';

            // Create buy status buttons
            fieldOptions.buyStatuses.forEach(status => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'status-btn';
                btn.textContent = status;
                btn.dataset.status = status;
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    selectStatusButton(buyStatusGroup, status, 'buyStatus');
                });
                buyStatusGroup.appendChild(btn);
            });

            // Create pay status buttons
            fieldOptions.payStatuses.forEach(status => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'status-btn';
                btn.textContent = status;
                btn.dataset.status = status;
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    selectStatusButton(payStatusGroup, status, 'payStatus');
                });
                payStatusGroup.appendChild(btn);
            });

            // Create ship status buttons
            fieldOptions.shipStatuses.forEach(status => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'status-btn';
                btn.textContent = status;
                btn.dataset.status = status;
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    selectStatusButton(shipStatusGroup, status, 'shipStatus');
                });
                shipStatusGroup.appendChild(btn);
            });
        }

        // Select status button
        function selectStatusButton(group, status, fieldId) {
            // Remove active class from all buttons in group
            group.querySelectorAll('.status-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            // Add active class to clicked button
            group.querySelector(`[data-status="${status}"]`).classList.add('active');
            // Store value (we'll retrieve it from active button later)
        }

        // Get active status value from group
        function getActiveStatusValue(groupId) {
            const group = document.getElementById(groupId);
            const activeBtn = group?.querySelector('.status-btn.active');
            return activeBtn?.textContent || '';
        }

        // Populate filter buttons
        function populateFilterButtons() {
            filterBuyStatusGroup.innerHTML = '';
            filterPayStatusGroup.innerHTML = '';
            filterShipStatusGroup.innerHTML = '';

            // Buy status filter buttons
            fieldOptions.buyStatuses.forEach(status => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'filter-btn';
                btn.textContent = status;
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    toggleFilterStatus('buyStatus', status);
                });
                filterBuyStatusGroup.appendChild(btn);
            });

            // Pay status filter buttons
            fieldOptions.payStatuses.forEach(status => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'filter-btn';
                btn.textContent = status;
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    toggleFilterStatus('payStatus', status);
                });
                filterPayStatusGroup.appendChild(btn);
            });

            // Ship status filter buttons
            fieldOptions.shipStatuses.forEach(status => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'filter-btn';
                btn.textContent = status;
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    toggleFilterStatus('shipStatus', status);
                });
                filterShipStatusGroup.appendChild(btn);
            });
        }

        // Toggle filter status
        function toggleFilterStatus(statusType, status) {
            if (filters[statusType].includes(status)) {
                filters[statusType] = filters[statusType].filter(s => s !== status);
            } else {
                filters[statusType].push(status);
            }
            updateFilterButtons();
            renderList();
        }

        // Update filter button UI
        function updateFilterButtons() {
            ['buyStatus', 'payStatus', 'shipStatus'].forEach(statusType => {
                const group = statusType === 'buyStatus' ? filterBuyStatusGroup :
                             statusType === 'payStatus' ? filterPayStatusGroup :
                             filterShipStatusGroup;
                group.querySelectorAll('.filter-btn').forEach(btn => {
                    if (filters[statusType].includes(btn.textContent)) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            });
        }

        // Fetch items from Notion
        async function fetchItems(skipCache = false) {
            try {
                const cacheParam = skipCache ? `&_t=${Date.now()}` : '';
                const response = await fetch(`${API_BASE}?action=query&databaseId=${NOTION_DB_ID}${cacheParam}`, {
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache',
                        'Expires': '0'
                    }
                });
                const data = await response.json();

                items = data.results || [];
                renderList();
            } catch (error) {
                console.error('Failed to fetch items:', error);
                listView.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>無法載入資料</p></div>';
            }
        }

        // Cloudinary upload
        uploadBtn.addEventListener('click', (e) => {
            e.preventDefault();
            fileInput.click();
        });

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            for (const file of files) {
                if (uploadedImages.length >= 2) {
                    alert('最多只能上傳 2 張圖片');
                    break;
                }
                await uploadToCloudinary(file);
            }
            fileInput.value = '';
        });

        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'unsigned_upload');
            formData.append('cloud_name', CLOUDINARY_CLOUD_NAME);

            try {
                const response = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
                    { method: 'POST', body: formData }
                );
                const data = await response.json();
                if (data.secure_url) {
                    uploadedImages.push(data.secure_url);
                    document.getElementById('productImages').value = JSON.stringify(uploadedImages);
                    renderImagePreview();
                }
            } catch (error) {
                console.error('Upload error:', error);
                alert('上傳失敗');
            }
        }

        function renderImagePreview() {
            imagePreview.innerHTML = uploadedImages.map((url, idx) => `
                <div class="image-item">
                    <img src="${url}" alt="Product image ${idx + 1}">
                    <button type="button" class="image-remove" onclick="removeImage(${idx})">✕</button>
                </div>
            `).join('');

            // Add placeholder for empty slots (up to 2)
            for (let i = uploadedImages.length; i < 2; i++) {
                imagePreview.innerHTML += `<div class="image-item"><div class="image-placeholder">圖片 ${i + 1}</div></div>`;
            }
        }

        function removeImage(idx) {
            uploadedImages.splice(idx, 1);
            document.getElementById('productImages').value = JSON.stringify(uploadedImages);
            renderImagePreview();
        }

        // Toggle collapsible sections
        function toggleSection(section) {
            const content = document.getElementById(section + 'Content');
            const icon = document.getElementById(section + 'Icon');

            content.classList.toggle('collapsed');
            icon.classList.toggle('collapsed');
        }

        // Calculate and update statistics
        function updateStats() {
            let totalPrice = 0;
            let totalProfit = 0;

            const filteredItems = items.filter(item => {
                const props = item.properties || {};
                const customer = getPropertyValue(props[FIELDS.customer]);
                const buyStatus = getPropertyValue(props[FIELDS.buyStatus]);
                const payStatus = getPropertyValue(props[FIELDS.payStatus]);
                const shipStatus = getPropertyValue(props[FIELDS.shipStatus]);

                // Customer name filter
                if (filters.customer && !customer.toLowerCase().includes(filters.customer.toLowerCase())) {
                    return false;
                }

                // Status filters
                if (filters.buyStatus.length > 0 && !filters.buyStatus.includes(buyStatus)) {
                    return false;
                }
                if (filters.payStatus.length > 0 && !filters.payStatus.includes(payStatus)) {
                    return false;
                }
                if (filters.shipStatus.length > 0 && !filters.shipStatus.includes(shipStatus)) {
                    return false;
                }

                return true;
            });

            filteredItems.forEach(item => {
                const props = item.properties || {};
                const twdTotal = parseFloat(getPropertyValue(props[FIELDS.twdTotal])) || 0;
                const twdProfit = parseFloat(getPropertyValue(props[FIELDS.twdProfit])) || 0;

                totalPrice += twdTotal;
                totalProfit += twdProfit;
            });

            const statsContainer = document.getElementById('statsContainer');
            const filterSummary = filters.customer || filters.buyStatus.length > 0 || filters.payStatus.length > 0 || filters.shipStatus.length > 0
                ? '（已篩選）'
                : '';

            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">件數 ${filterSummary}</div>
                    <div class="stat-value">${filteredItems.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">台幣總價</div>
                    <div class="stat-value">$${formatNumber(totalPrice)}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">台幣利潤</div>
                    <div class="stat-value">$${formatNumber(totalProfit)}</div>
                </div>
            `;
        }

        // Clear input fields
        function clearFilterCustomer() {
            filterCustomerInput.value = '';
            filters.customer = '';
            renderList();
        }

        function clearCustomer() {
            document.getElementById('customer').value = '';
        }

        function clearProductName() {
            document.getElementById('productName').value = '';
        }

        // Render list
        function renderList() {
            // Filter items
            const filteredItems = items.filter(item => {
                const props = item.properties || {};
                const customer = getPropertyValue(props[FIELDS.customer]);
                const buyStatus = getPropertyValue(props[FIELDS.buyStatus]);
                const payStatus = getPropertyValue(props[FIELDS.payStatus]);
                const shipStatus = getPropertyValue(props[FIELDS.shipStatus]);

                // Customer name filter
                if (filters.customer && !customer.toLowerCase().includes(filters.customer.toLowerCase())) {
                    return false;
                }

                // Status filters
                if (filters.buyStatus.length > 0 && !filters.buyStatus.includes(buyStatus)) {
                    return false;
                }
                if (filters.payStatus.length > 0 && !filters.payStatus.includes(payStatus)) {
                    return false;
                }
                if (filters.shipStatus.length > 0 && !filters.shipStatus.includes(shipStatus)) {
                    return false;
                }

                return true;
            });

            if (filteredItems.length === 0) {
                listView.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><p>沒有符合的需求單</p></div>';
                updateStats();
                return;
            }

            listView.innerHTML = '<div class="list">' + filteredItems.map(item => {
                const props = item.properties || {};
                const title = getPropertyValue(props[FIELDS.title]);
                const customer = getPropertyValue(props[FIELDS.customer]);
                const category = getPropertyValue(props[FIELDS.category]);
                const productName = getPropertyValue(props[FIELDS.productName]);
                const quantity = getPropertyValue(props[FIELDS.quantity]);
                const twdTotal = getPropertyValue(props[FIELDS.twdTotal]);
                const buyStatus = getPropertyValue(props[FIELDS.buyStatus]);
                const payStatus = getPropertyValue(props[FIELDS.payStatus]);
                const shipStatus = getPropertyValue(props[FIELDS.shipStatus]);
                const productImagesValue = getPropertyValue(props[FIELDS.productImages]);
                const images = productImagesValue ? JSON.parse(productImagesValue) : [];
                const firstImage = images.length > 0 ? images[0] : null;

                return `
                    <div class="card" onclick="editItem('${item.id}')">
                        <div class="card-content">
                            <div class="card-header">
                                <div>
                                    <div class="card-title">${title}</div>
                                    <div class="card-subtitle-row">
                                        <span class="card-subtitle">${customer}</span>
                                        ${category ? `<span class="card-category">📦 ${category}</span>` : ''}
                                    </div>
                                </div>
                            </div>
                            <div class="card-info">
                                <div class="info-item">
                                    <span class="info-label">商品</span>
                                    <span class="info-value">${productName}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">數量</span>
                                    <span class="info-value">${formatNumber(quantity)} 件</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">台幣總價</span>
                                    <span class="info-value">$${formatNumber(twdTotal)}</span>
                                </div>
                            </div>
                            <div class="badges">
                                ${buyStatus ? `<span class="badge badge-status badge-status-${buyStatus}">${buyStatus}</span>` : ''}
                                ${payStatus ? `<span class="badge badge-status badge-status-${payStatus}">${payStatus}</span>` : ''}
                                ${shipStatus ? `<span class="badge badge-status badge-status-${shipStatus}">${shipStatus}</span>` : ''}
                            </div>
                        </div>
                        ${firstImage ? `<img src="${firstImage}" alt="Product" class="card-image">` : '<div class="card-image-placeholder"></div>'}
                    </div>
                `;
            }).join('') + '</div>';
            updateStats();
        }

        // Open form for new item
        function newItem() {
            currentItem = null;
            uploadedImages = [];
            formTitle.textContent = '新增需求單';
            deleteBtn.style.display = 'none';
            itemForm.reset();
            document.getElementById('productImages').value = '';
            renderImagePreview();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('purchaseDate').value = today;

            // Clear status button selections
            document.querySelectorAll('#buyStatusGroup .status-btn, #payStatusGroup .status-btn, #shipStatusGroup .status-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Auto-generate next request number
            if (items.length > 0) {
                const allNumbers = items
                    .map(item => {
                        const title = getPropertyValue(item.properties[FIELDS.title]);
                        const match = title.match(/(\D+)(\d+)$/);
                        return match ? { prefix: match[1], num: parseInt(match[2]) } : null;
                    })
                    .filter(x => x);

                if (allNumbers.length > 0) {
                    // 取得最後一筆的前綴和數字
                    const lastNumber = allNumbers.sort((a, b) => b.num - a.num)[0];
                    const nextNum = String(lastNumber.num + 1).padStart(3, '0');
                    document.getElementById('title').value = lastNumber.prefix + nextNum;
                }
            }

            formModal.classList.add('active');
        }

        // Edit item
        function editItem(itemId) {
            const item = items.find(i => i.id === itemId);
            if (!item) return;

            currentItem = item;
            const props = item.properties || {};

            formTitle.textContent = '編輯需求單';
            deleteBtn.style.display = 'inline-flex';

            document.getElementById('title').value = getPropertyValue(props[FIELDS.title]);
            document.getElementById('customer').value = getPropertyValue(props[FIELDS.customer]);
            document.getElementById('category').value = getPropertyValue(props[FIELDS.category]);
            document.getElementById('productName').value = getPropertyValue(props[FIELDS.productName]);
            document.getElementById('quantity').value = getPropertyValue(props[FIELDS.quantity]);
            document.getElementById('jpyCost').value = getPropertyValue(props[FIELDS.jpyCost]);
            document.getElementById('jpyPrice').value = getPropertyValue(props[FIELDS.jpyPrice]);
            document.getElementById('twdPrice').value = getPropertyValue(props[FIELDS.twdPrice]);
            document.getElementById('weight').value = getPropertyValue(props[FIELDS.weight]);
            document.getElementById('purchaseDate').value = getPropertyValue(props[FIELDS.purchaseDate]);

            // Restore images
            const productImagesValue = getPropertyValue(props[FIELDS.productImages]);
            uploadedImages = productImagesValue ? JSON.parse(productImagesValue) : [];
            document.getElementById('productImages').value = JSON.stringify(uploadedImages);
            renderImagePreview();

            // Set status buttons
            const buyStatusValue = getPropertyValue(props[FIELDS.buyStatus]);
            const payStatusValue = getPropertyValue(props[FIELDS.payStatus]);
            const shipStatusValue = getPropertyValue(props[FIELDS.shipStatus]);

            if (buyStatusValue) {
                const buyBtn = document.querySelector(`#buyStatusGroup [data-status="${buyStatusValue}"]`);
                if (buyBtn) {
                    document.querySelectorAll('#buyStatusGroup .status-btn').forEach(b => b.classList.remove('active'));
                    buyBtn.classList.add('active');
                }
            }
            if (payStatusValue) {
                const payBtn = document.querySelector(`#payStatusGroup [data-status="${payStatusValue}"]`);
                if (payBtn) {
                    document.querySelectorAll('#payStatusGroup .status-btn').forEach(b => b.classList.remove('active'));
                    payBtn.classList.add('active');
                }
            }
            if (shipStatusValue) {
                const shipBtn = document.querySelector(`#shipStatusGroup [data-status="${shipStatusValue}"]`);
                if (shipBtn) {
                    document.querySelectorAll('#shipStatusGroup .status-btn').forEach(b => b.classList.remove('active'));
                    shipBtn.classList.add('active');
                }
            }

            formModal.classList.add('active');
        }

        // Submit form
        async function handleSubmit(e) {
            e.preventDefault();

            const data = {
                properties: {
                    [FIELDS.title]: {
                        title: [{ text: { content: document.getElementById('title').value } }]
                    },
                    [FIELDS.customer]: {
                        rich_text: [{ text: { content: document.getElementById('customer').value } }]
                    },
                    [FIELDS.category]: {
                        select: { name: document.getElementById('category').value }
                    },
                    [FIELDS.productName]: {
                        rich_text: [{ text: { content: document.getElementById('productName').value } }]
                    },
                    [FIELDS.productImages]: {
                        rich_text: [{ text: { content: document.getElementById('productImages').value } }]
                    },
                    [FIELDS.quantity]: {
                        number: parseFloat(document.getElementById('quantity').value) || 0
                    },
                    [FIELDS.jpyCost]: {
                        number: parseFloat(document.getElementById('jpyCost').value) || null
                    },
                    [FIELDS.jpyPrice]: {
                        number: parseFloat(document.getElementById('jpyPrice').value) || null
                    },
                    [FIELDS.twdPrice]: {
                        number: parseFloat(document.getElementById('twdPrice').value) || null
                    },
                    [FIELDS.weight]: {
                        number: parseFloat(document.getElementById('weight').value) || null
                    },
                    [FIELDS.buyStatus]: {
                        status: { name: getActiveStatusValue('buyStatusGroup') }
                    },
                    [FIELDS.payStatus]: {
                        status: { name: getActiveStatusValue('payStatusGroup') }
                    },
                    [FIELDS.shipStatus]: {
                        status: { name: getActiveStatusValue('shipStatusGroup') }
                    },
                    [FIELDS.purchaseDate]: {
                        date: { start: document.getElementById('purchaseDate').value }
                    }
                }
            };

            try {
                if (currentItem) {
                    // Update
                    const response = await fetch(`${API_BASE}?action=update&pageId=${currentItem.id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (!response.ok) throw new Error('Failed to update');
                } else {
                    // Create
                    const createData = {
                        ...data,
                        parent: { database_id: NOTION_DB_ID }
                    };

                    const response = await fetch(API_BASE, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(createData)
                    });

                    if (!response.ok) throw new Error('Failed to create');
                }

                closeModal();
                await fetchItems(true);
            } catch (error) {
                console.error('Save error:', error);
                alert('保存失敗，請重試');
            }
        }

        // Delete item
        async function handleDelete() {
            if (!currentItem || !confirm('確定刪除？')) return;

            try {
                const response = await fetch(`${API_BASE}?action=delete&pageId=${currentItem.id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete');

                closeModal();
                await fetchItems(true);
            } catch (error) {
                console.error('Delete error:', error);
                alert('刪除失敗，請重試');
            }
        }

        // Close modal
        function closeModal() {
            formModal.classList.remove('active');
            currentItem = null;
            itemForm.reset();
        }

        // Event listeners
        newBtn.addEventListener('click', newItem);
        refreshBtn.addEventListener('click', async () => {
            refreshBtn.style.opacity = '0.5';
            refreshBtn.style.pointerEvents = 'none';
            await fetchItems(true);
            refreshBtn.style.opacity = '1';
            refreshBtn.style.pointerEvents = 'auto';
        });
        closeBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);
        deleteBtn.addEventListener('click', handleDelete);
        submitBtn.addEventListener('click', (e) => {
            e.preventDefault();
            itemForm.dispatchEvent(new Event('submit'));
        });
        itemForm.addEventListener('submit', handleSubmit);

        // Auto-fill jpyPrice when jpyCost changes
        document.getElementById('jpyCost').addEventListener('input', (e) => {
            const jpyCostValue = e.target.value;
            const jpyPriceInput = document.getElementById('jpyPrice');
            // Only auto-fill if jpyPrice is empty
            if (!jpyPriceInput.value && jpyCostValue) {
                jpyPriceInput.value = jpyCostValue;
            }
        });

        // Filter event listeners
        filterCustomerInput.addEventListener('input', (e) => {
            filters.customer = e.target.value;
            renderList();
        });

        clearFiltersBtn.addEventListener('click', () => {
            filters.customer = '';
            filters.buyStatus = [];
            filters.payStatus = [];
            filters.shipStatus = [];
            filterCustomerInput.value = '';
            updateFilterButtons();
            renderList();
        });

        // Close modal on outside click
        formModal.addEventListener('click', (e) => {
            if (e.target === formModal) closeModal();
        });

        // Initialize on load
        init();
    </script>
</body>
</html>
