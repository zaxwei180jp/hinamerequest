<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>需求單</title>
    <style>
        :root {
            --primary: #9B8C7E;
            --secondary: #A69F94;
            --accent: #B5A89F;
            --bg: #FAFAF8;
            --surface: #FFFFFF;
            --border: #E8E3DB;
            --text: #2C2C2C;
            --text-light: #6B6B6B;
            --danger: #C17070;
            --success: #7B9B88;
            --warning: #B5A876;

            /* Status colors - Morandi palette */
            --status-buy: #A69F94;        /* 購買狀態 - 褐色 */
            --status-pay: #8BA99F;        /* 付款狀態 - 綠色 */
            --status-ship: #9FA8C4;       /* 發貨狀態 - 藍色 */
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1A1A1A;
                --surface: #2D2D2D;
                --border: #3E3E3E;
                --text: #E8E3DB;
                --text-light: #B0A89E;
                --status-buy: #6B6660;
                --status-pay: #556560;
                --status-ship: #616B80;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            max-width: 100%;
        }

        html {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.5;
            overflow-x: hidden;
            width: 100vw;
            max-width: 100%;
        }

        /* Header */
        header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            flex: 1;
        }

        .btn {
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--surface);
        }

        .btn-primary:active {
            background-color: var(--secondary);
        }

        .btn-secondary {
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:active {
            background-color: var(--border);
        }

        .btn-danger {
            background-color: var(--danger);
            color: var(--surface);
        }

        .btn-danger:active {
            opacity: 0.8;
        }

        .btn-small {
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            min-height: 40px;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 100%;
            padding: 1rem;
            margin: 0 auto;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* List */
        .list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .card:active {
            background-color: var(--border);
            transform: scale(0.98);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .card-subtitle {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .card-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            font-size: 0.875rem;
            margin-bottom: 0.75rem;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .info-label {
            color: var(--text-light);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-value {
            font-weight: 500;
        }

        .status-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.4rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: white;
        }

        .status-buy {
            background-color: var(--status-buy);
        }

        .status-pay {
            background-color: var(--status-pay);
        }

        .status-ship {
            background-color: var(--status-ship);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: flex-end;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--surface);
            width: 100%;
            max-width: 100%;
            max-height: 90vh;
            border-radius: 1rem 1rem 0 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            background-color: var(--surface);
            position: sticky;
            top: 0;
            z-index: 10;
            flex-shrink: 0;
        }

        .modal-header-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-header-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            padding: 0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-wrapper {
            overflow-y: auto;
            flex: 1;
            padding: 1.5rem 1rem;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text);
            background-color: var(--surface);
            min-height: 44px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(155, 140, 126, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        /* Category buttons */
        .category-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 0.75rem;
        }

        .category-btn {
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 0.5rem;
            background-color: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .category-btn:active {
            border-color: var(--primary);
            background-color: var(--primary);
            color: var(--surface);
        }

        .category-btn.selected {
            border-color: var(--primary);
            background-color: var(--primary);
            color: var(--surface);
        }

        /* Image upload */
        .image-upload-section {
            border: 1px dashed var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .image-preview {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .image-item {
            position: relative;
            border-radius: 0.5rem;
            overflow: hidden;
            background-color: var(--border);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-remove {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.25rem;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .image-placeholder {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .upload-input {
            display: none;
        }

        /* Section */
        .form-section {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .form-section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-light);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        /* Buttons */
        .modal-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .modal-actions .btn {
            min-width: auto;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
        }

        .modal-actions .btn-primary {
            flex: 1;
            min-width: auto;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (min-width: 768px) {
            .modal-content {
                max-width: 500px;
                max-height: none;
                margin: auto;
                border-radius: 1rem;
            }

            .modal {
                align-items: center;
                justify-content: center;
                background-color: rgba(0, 0, 0, 0.3);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <h1>需求單</h1>
            <button class="btn btn-primary" id="newBtn">新增</button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <div id="listView">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 1rem;">載入中…</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="formModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-header-left">
                    <h2 class="modal-title" id="formTitle">新增需求單</h2>
                </div>
                <div class="modal-header-right">
                    <div class="modal-actions" id="headerActions"></div>
                    <button class="modal-close" id="closeBtn">✕</button>
                </div>
            </div>

            <div class="form-wrapper">
            <form id="itemForm">
                <!-- 基本資訊 -->
                <div class="form-section">
                    <div class="section-title">基本資訊</div>

                    <div class="form-group">
                        <label>需求單編號</label>
                        <input type="text" id="title" placeholder="例：REQ-001" required>
                    </div>

                    <div class="form-group">
                        <label>客戶</label>
                        <input type="text" id="customer" placeholder="客戶名稱" required>
                    </div>

                    <div class="form-group">
                        <label>類別</label>
                        <div class="category-buttons" id="categoryButtons"></div>
                        <input type="hidden" id="category" required>
                    </div>

                    <div class="form-group">
                        <label>商品名稱</label>
                        <input type="text" id="productName" placeholder="商品名稱" required>
                    </div>
                </div>

                <!-- 圖片上傳 -->
                <div class="form-section">
                    <div class="section-title">商品圖片</div>
                    <div class="image-upload-section">
                        <button type="button" class="btn btn-secondary btn-small" id="uploadBtn">上傳圖片</button>
                        <input type="file" class="upload-input" id="fileInput" accept="image/*" multiple>
                        <div class="image-preview" id="imagePreview"></div>
                    </div>
                    <input type="hidden" id="productImages">
                </div>

                <!-- 數量與價格 -->
                <div class="form-section">
                    <div class="section-title">數量與價格</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>數量</label>
                            <input type="number" id="quantity" placeholder="0" min="0" step="1" required>
                        </div>

                        <div class="form-group">
                            <label>日幣成本單價</label>
                            <input type="number" id="jpyCost" placeholder="¥ 0" min="0" step="0.01">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>日幣報價單價</label>
                            <input type="number" id="jpyPrice" placeholder="¥ 0" min="0" step="0.01">
                        </div>

                        <div class="form-group">
                            <label>台幣報價單價</label>
                            <input type="number" id="twdPrice" placeholder="$ 0" min="0" step="0.01">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>重量 (KG)</label>
                        <input type="number" id="weight" placeholder="0" min="0" step="0.01">
                    </div>
                </div>

                <!-- 狀態 -->
                <div class="form-section">
                    <div class="section-title">狀態</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>購買狀態</label>
                            <div class="category-buttons" id="buyStatusButtons"></div>
                            <input type="hidden" id="buyStatus" required>
                        </div>

                        <div class="form-group">
                            <label>付款狀態</label>
                            <div class="category-buttons" id="payStatusButtons"></div>
                            <input type="hidden" id="payStatus" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>發貨狀態</label>
                        <div class="category-buttons" id="shipStatusButtons"></div>
                        <input type="hidden" id="shipStatus" required>
                    </div>
                </div>

                <!-- 日期 -->
                <div class="form-section">
                    <div class="section-title">日期</div>

                    <div class="form-group">
                        <label>採買日期</label>
                        <input type="date" id="purchaseDate" required>
                    </div>
                </div>

            </form>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const NOTION_DB_ID = '3e1c662d5fc480f680b0ef4c0b936e25';
        const API_BASE = '/api/notion';
        const CLOUDINARY_CLOUD_NAME = 'doue38blc';
        const CLOUDINARY_API_KEY = '487785152371311';

        // Field mapping - 繁體中文欄位名稱
        const FIELDS = {
            title: '需求單號',
            customer: '客戶',
            category: '類別',
            productName: '商品名稱',
            productImages: '商品圖片',
            quantity: '數量',
            jpyCost: '日幣成本單價',
            jpyPrice: '日幣報價單價',
            twdPrice: '台幣報價單價',
            jpyTotal: '日幣報價總價',
            twdTotal: '台幣總價',
            twdProfit: '台幣利潤',
            weight: '重量',
            buyStatus: '購買狀態',
            payStatus: '付款狀態',
            shipStatus: '發貨狀態',
            purchaseDate: '採買日期'
        };

        // State
        let items = [];
        let currentItem = null;
        let fieldOptions = {
            categories: [],
            buyStatuses: [],
            payStatuses: [],
            shipStatuses: []
        };
        let uploadedImages = [];

        // DOM Elements
        const listView = document.getElementById('listView');
        const formModal = document.getElementById('formModal');
        const itemForm = document.getElementById('itemForm');
        const newBtn = document.getElementById('newBtn');
        const closeBtn = document.getElementById('closeBtn');
        const formTitle = document.getElementById('formTitle');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');

        // Helper: Get value from Notion property
        function getPropertyValue(prop) {
            if (!prop) return '';
            if (prop.title) return prop.title.map(t => t.plain_text).join('');
            if (prop.rich_text) return prop.rich_text.map(t => t.plain_text).join('');
            if (prop.number !== undefined) return prop.number || '';
            if (prop.select) return prop.select.name || '';
            if (prop.status) return prop.status.name || '';
            if (prop.date) return prop.date.start || '';
            if (prop.formula && prop.formula.number !== undefined) return prop.formula.number || '';
            return '';
        }

        // Initialize
        async function init() {
            await fetchFieldOptions();
            await fetchItems();
        }

        // Fetch field options from Notion
        async function fetchFieldOptions() {
            try {
                const response = await fetch(`${API_BASE}?action=getDatabase&databaseId=${NOTION_DB_ID}`);
                const data = await response.json();

                if (data.properties) {
                    const props = data.properties;

                    if (props[FIELDS.category]?.select?.options) {
                        fieldOptions.categories = props[FIELDS.category].select.options.map(o => o.name);
                    }
                    if (props[FIELDS.buyStatus]?.status?.options) {
                        fieldOptions.buyStatuses = props[FIELDS.buyStatus].status.options.map(o => o.name);
                    }
                    if (props[FIELDS.payStatus]?.status?.options) {
                        fieldOptions.payStatuses = props[FIELDS.payStatus].status.options.map(o => o.name);
                    }
                    if (props[FIELDS.shipStatus]?.status?.options) {
                        fieldOptions.shipStatuses = props[FIELDS.shipStatus].status.options.map(o => o.name);
                    }

                    populateButtons();
                }
            } catch (error) {
                console.error('Failed to fetch field options:', error);
            }
        }

        // Populate button groups
        function populateButtons() {
            const categoryBtn = document.getElementById('categoryButtons');
            const buyBtn = document.getElementById('buyStatusButtons');
            const payBtn = document.getElementById('payStatusButtons');
            const shipBtn = document.getElementById('shipStatusButtons');

            categoryBtn.innerHTML = fieldOptions.categories.map(opt =>
                `<button type="button" class="category-btn" data-value="${opt}">${opt}</button>`
            ).join('');

            buyBtn.innerHTML = fieldOptions.buyStatuses.map(opt =>
                `<button type="button" class="category-btn" data-value="${opt}">${opt}</button>`
            ).join('');

            payBtn.innerHTML = fieldOptions.payStatuses.map(opt =>
                `<button type="button" class="category-btn" data-value="${opt}">${opt}</button>`
            ).join('');

            shipBtn.innerHTML = fieldOptions.shipStatuses.map(opt =>
                `<button type="button" class="category-btn" data-value="${opt}">${opt}</button>`
            ).join('');

            // Add button click handlers
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const group = btn.parentElement;
                    group.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    const hiddenInput = group.nextElementSibling;
                    if (hiddenInput && hiddenInput.type === 'hidden') {
                        hiddenInput.value = btn.dataset.value;
                    }
                });
            });
        }

        // Fetch items from Notion
        async function fetchItems() {
            try {
                const response = await fetch(`${API_BASE}?action=query&databaseId=${NOTION_DB_ID}`);
                const data = await response.json();

                items = data.results || [];
                renderList();
            } catch (error) {
                console.error('Failed to fetch items:', error);
                listView.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>無法載入資料</p></div>';
            }
        }

        // Render list with status colors
        function renderList() {
            if (items.length === 0) {
                listView.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><p>沒有需求單</p></div>';
                return;
            }

            listView.innerHTML = '<div class="list">' + items.map(item => {
                const props = item.properties || {};
                const title = getPropertyValue(props[FIELDS.title]);
                const customer = getPropertyValue(props[FIELDS.customer]);
                const category = getPropertyValue(props[FIELDS.category]);
                const productName = getPropertyValue(props[FIELDS.productName]);
                const quantity = getPropertyValue(props[FIELDS.quantity]);
                const twdPrice = getPropertyValue(props[FIELDS.twdPrice]);
                const buyStatus = getPropertyValue(props[FIELDS.buyStatus]);
                const payStatus = getPropertyValue(props[FIELDS.payStatus]);
                const shipStatus = getPropertyValue(props[FIELDS.shipStatus]);

                return `
                    <div class="card" onclick="editItem('${item.id}')">
                        <div class="card-header">
                            <div>
                                <div class="card-title">${title}</div>
                                <div class="card-subtitle">${customer}${category ? ' · ' + category : ''}</div>
                            </div>
                        </div>
                        <div class="card-info">
                            <div class="info-item">
                                <span class="info-label">商品</span>
                                <span class="info-value">${productName}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">數量</span>
                                <span class="info-value">${quantity} 件</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">台幣報價</span>
                                <span class="info-value">$${twdPrice ? parseFloat(twdPrice).toLocaleString() : '0'}</span>
                            </div>
                        </div>
                        <div class="status-badges">
                            ${buyStatus ? `<span class="status-badge status-buy">${buyStatus}</span>` : ''}
                            ${payStatus ? `<span class="status-badge status-pay">${payStatus}</span>` : ''}
                            ${shipStatus ? `<span class="status-badge status-ship">${shipStatus}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('') + '</div>';
        }

        // Cloudinary upload
        uploadBtn.addEventListener('click', (e) => {
            e.preventDefault();
            fileInput.click();
        });

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            for (const file of files) {
                if (uploadedImages.length >= 2) {
                    alert('最多只能上傳 2 張圖片');
                    break;
                }
                await uploadToCloudinary(file);
            }
            fileInput.value = '';
        });

        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'unsigned_upload');
            formData.append('cloud_name', CLOUDINARY_CLOUD_NAME);

            try {
                const response = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
                    { method: 'POST', body: formData }
                );
                const data = await response.json();
                if (data.secure_url) {
                    uploadedImages.push(data.secure_url);
                    document.getElementById('productImages').value = JSON.stringify(uploadedImages);
                    renderImagePreview();
                }
            } catch (error) {
                console.error('Upload error:', error);
                alert('上傳失敗');
            }
        }

        function renderImagePreview() {
            imagePreview.innerHTML = uploadedImages.map((url, idx) => `
                <div class="image-item">
                    <img src="${url}" alt="Product image ${idx + 1}">
                    <button type="button" class="image-remove" onclick="removeImage(${idx})">✕</button>
                </div>
            `).join('');

            // Add placeholder for empty slots (up to 2)
            for (let i = uploadedImages.length; i < 2; i++) {
                imagePreview.innerHTML += `<div class="image-item"><div class="image-placeholder">圖片 ${i + 1}</div></div>`;
            }
        }

        function removeImage(idx) {
            uploadedImages.splice(idx, 1);
            document.getElementById('productImages').value = JSON.stringify(uploadedImages);
            renderImagePreview();
        }

        // Render header actions
        function renderHeaderActions() {
            const headerActions = document.getElementById('headerActions');
            if (currentItem) {
                // Edit mode
                headerActions.innerHTML = `
                    <button type="button" class="btn btn-danger btn-small" id="deleteBtn">刪除</button>
                    <button type="button" class="btn btn-secondary btn-small" id="cancelBtn">取消</button>
                    <button type="submit" class="btn btn-primary btn-small" form="itemForm">保存</button>
                `;
                document.getElementById('deleteBtn').addEventListener('click', handleDelete);
            } else {
                // New mode
                headerActions.innerHTML = `
                    <button type="button" class="btn btn-secondary btn-small" id="cancelBtn">取消</button>
                    <button type="submit" class="btn btn-primary btn-small" form="itemForm">保存</button>
                `;
            }
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
        }

        // Open form for new item
        function newItem() {
            currentItem = null;
            uploadedImages = [];
            formTitle.textContent = '新增需求單';
            itemForm.reset();
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
            document.querySelectorAll('input[type="hidden"]').forEach(i => i.value = '');
            renderImagePreview();
            renderHeaderActions();

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('purchaseDate').value = today;

            // Auto-generate next request number
            if (items.length > 0) {
                const allNumbers = items
                    .map(item => {
                        const title = getPropertyValue(item.properties[FIELDS.title]);
                        const match = title.match(/(\D+)(\d+)$/);
                        return match ? { prefix: match[1], num: parseInt(match[2]) } : null;
                    })
                    .filter(x => x);

                if (allNumbers.length > 0) {
                    const lastNumber = allNumbers.sort((a, b) => b.num - a.num)[0];
                    const nextNum = String(lastNumber.num + 1).padStart(3, '0');
                    document.getElementById('title').value = lastNumber.prefix + nextNum;
                }
            }

            formModal.classList.add('active');
        }

        // Edit item
        function editItem(itemId) {
            const item = items.find(i => i.id === itemId);
            if (!item) return;

            currentItem = item;
            const props = item.properties || {};

            formTitle.textContent = '編輯需求單';
            renderHeaderActions();

            // Reset all buttons
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));

            // Set values
            document.getElementById('title').value = getPropertyValue(props[FIELDS.title]);
            document.getElementById('customer').value = getPropertyValue(props[FIELDS.customer]);
            document.getElementById('productName').value = getPropertyValue(props[FIELDS.productName]);
            document.getElementById('quantity').value = getPropertyValue(props[FIELDS.quantity]);
            document.getElementById('jpyCost').value = getPropertyValue(props[FIELDS.jpyCost]);
            document.getElementById('jpyPrice').value = getPropertyValue(props[FIELDS.jpyPrice]);
            document.getElementById('twdPrice').value = getPropertyValue(props[FIELDS.twdPrice]);
            document.getElementById('weight').value = getPropertyValue(props[FIELDS.weight]);
            document.getElementById('purchaseDate').value = getPropertyValue(props[FIELDS.purchaseDate]);

            // Set category
            const category = getPropertyValue(props[FIELDS.category]);
            if (category) {
                document.getElementById('category').value = category;
                document.querySelectorAll('#categoryButtons .category-btn').forEach(btn => {
                    if (btn.dataset.value === category) btn.classList.add('selected');
                });
            }

            // Set statuses
            const buyStatus = getPropertyValue(props[FIELDS.buyStatus]);
            if (buyStatus) {
                document.getElementById('buyStatus').value = buyStatus;
                document.querySelectorAll('#buyStatusButtons .category-btn').forEach(btn => {
                    if (btn.dataset.value === buyStatus) btn.classList.add('selected');
                });
            }

            const payStatus = getPropertyValue(props[FIELDS.payStatus]);
            if (payStatus) {
                document.getElementById('payStatus').value = payStatus;
                document.querySelectorAll('#payStatusButtons .category-btn').forEach(btn => {
                    if (btn.dataset.value === payStatus) btn.classList.add('selected');
                });
            }

            const shipStatus = getPropertyValue(props[FIELDS.shipStatus]);
            if (shipStatus) {
                document.getElementById('shipStatus').value = shipStatus;
                document.querySelectorAll('#shipStatusButtons .category-btn').forEach(btn => {
                    if (btn.dataset.value === shipStatus) btn.classList.add('selected');
                });
            }

            // Load images
            const images = getPropertyValue(props[FIELDS.productImages]);
            uploadedImages = images ? images.split(' ').filter(url => url) : [];
            renderImagePreview();

            formModal.classList.add('active');
        }

        // Submit form
        async function handleSubmit(e) {
            e.preventDefault();

            const data = {
                properties: {
                    [FIELDS.title]: {
                        title: [{ text: { content: document.getElementById('title').value } }]
                    },
                    [FIELDS.customer]: {
                        rich_text: [{ text: { content: document.getElementById('customer').value } }]
                    },
                    [FIELDS.category]: {
                        select: { name: document.getElementById('category').value }
                    },
                    [FIELDS.productName]: {
                        rich_text: [{ text: { content: document.getElementById('productName').value } }]
                    },
                    [FIELDS.productImages]: {
                        rich_text: [{ text: { content: uploadedImages.join(' ') } }]
                    },
                    [FIELDS.quantity]: {
                        number: parseFloat(document.getElementById('quantity').value) || 0
                    },
                    [FIELDS.jpyCost]: {
                        number: parseFloat(document.getElementById('jpyCost').value) || null
                    },
                    [FIELDS.jpyPrice]: {
                        number: parseFloat(document.getElementById('jpyPrice').value) || null
                    },
                    [FIELDS.twdPrice]: {
                        number: parseFloat(document.getElementById('twdPrice').value) || null
                    },
                    [FIELDS.weight]: {
                        number: parseFloat(document.getElementById('weight').value) || null
                    },
                    [FIELDS.buyStatus]: {
                        status: { name: document.getElementById('buyStatus').value }
                    },
                    [FIELDS.payStatus]: {
                        status: { name: document.getElementById('payStatus').value }
                    },
                    [FIELDS.shipStatus]: {
                        status: { name: document.getElementById('shipStatus').value }
                    },
                    [FIELDS.purchaseDate]: {
                        date: { start: document.getElementById('purchaseDate').value }
                    }
                }
            };

            try {
                if (currentItem) {
                    const response = await fetch(`${API_BASE}?action=update&pageId=${currentItem.id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    if (!response.ok) throw new Error('Failed to update');
                } else {
                    const createData = {
                        ...data,
                        parent: { database_id: NOTION_DB_ID }
                    };
                    const response = await fetch(API_BASE, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(createData)
                    });
                    if (!response.ok) throw new Error('Failed to create');
                }

                closeModal();
                await fetchItems();
            } catch (error) {
                console.error('Save error:', error);
                alert('保存失敗，請重試');
            }
        }

        // Delete item
        async function handleDelete() {
            if (!currentItem || !confirm('確定刪除？')) return;

            try {
                const response = await fetch(`${API_BASE}?action=delete&pageId=${currentItem.id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete');

                closeModal();
                await fetchItems();
            } catch (error) {
                console.error('Delete error:', error);
                alert('刪除失敗，請重試');
            }
        }

        // Close modal
        function closeModal() {
            formModal.classList.remove('active');
            currentItem = null;
            uploadedImages = [];
            itemForm.reset();
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
            renderImagePreview();
        }

        // Event listeners
        newBtn.addEventListener('click', newItem);
        closeBtn.addEventListener('click', closeModal);
        itemForm.addEventListener('submit', handleSubmit);

        formModal.addEventListener('click', (e) => {
            if (e.target === formModal) closeModal();
        });

        // Initialize on load
        init();
    </script>
</body>
</html>
